services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    environment:
      DATABASE_PATH: /app/data/xuangu.db
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
      SELECTION_RUN_HOUR: ${SELECTION_RUN_HOUR:-15}
      SELECTION_RUN_MINUTE: ${SELECTION_RUN_MINUTE:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      JOB_API_TOKEN: ${JOB_API_TOKEN:-}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      EASTMONEY_MIN_INTERVAL: ${EASTMONEY_MIN_INTERVAL:-1.0}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - sqlite-data:/app/data
      - ./backend/existing:/app/existing:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    environment:
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlite-data:
